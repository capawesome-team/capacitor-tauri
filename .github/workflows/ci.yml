name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.vscode/**'

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint

  tauri-build:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - name: Build platform
        working-directory: '.'
        run: |
          npm ci
          npm run build
      - name: Install example dependencies
        run: npm install
      - name: Build frontend, sync, and compile the app
        run: |
          npm run build
          npm run sync
          npm run tauri:build
      # WebDriver e2e via tauri-driver. Non-blocking for now: headless
      # WebKitGTK + tauri-driver session creation is flaky in CI and needs
      # stabilization. The 3-OS build matrix above is the required
      # cross-platform integration gate.
      - name: Run e2e (Linux, non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          cargo install tauri-driver --locked
          xvfb-run --auto-servernum npm run e2e

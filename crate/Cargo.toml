[package]
name = "capacitor-tauri"
version = "0.0.1"
description = "Capacitor platform runtime for Tauri apps."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/capawesome-team/capacitor-tauri"
homepage = "https://capawesome.io/"
readme = "README.md"
keywords = ["capacitor", "tauri", "desktop", "webview", "capawesome"]
categories = ["gui"]
# `bridge.js` is generated (`npm run build:shim`) and baked in via
# `include_str!`; list files explicitly so it is packaged for crates.io.
include = ["src/**/*.rs", "src/bridge.js", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
tauri = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
